[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hbedb-sway"
version = "1.0.0"
description = "Subject-level analysis of vision and support-surface effects on quiet-stance center-of-pressure sway."
readme = "README.md"
license = {text = "CC-BY-4.0"}
requires-python = ">=3.11"
authors = [{name = "Víctor Andrés Gómez López"}]
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pandas==3.1.1",
    "statsmodels==0.15.0",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "jupyter==1.1.1",
    "nbformat==5.11.1",
    "nbclient==0.11.0",
    "ipykernel==7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
